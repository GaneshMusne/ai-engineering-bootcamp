[project]
name = "prerequisites"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.27.0",
    "ipykernel>=7.4.0",
    "openai>=3.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[project.scripts]
prerequisites = "prerequisites:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/chatbot_ui",
]

[dependency-groups]
dev = [
    "langchain-community<0.4.2",
    "langgraph>=1.2.14",
    "langsmith>=0.14.4",
    "matplotlib>=3.11.2",
    "qdrant-client>=1.19.1",
    "ragas>=0.3.1",
    "sentence-transformers>=6.1.0",
]
